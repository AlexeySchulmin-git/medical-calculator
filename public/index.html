<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медицинский калькулятор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        #medical-calculator {
            margin: 0 auto;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 0.9em;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Медицинский калькулятор</h1>
        <p class="subtitle">Расчёт стоимости медицинской транспортировки</p>
        
        <div id="medical-calculator"></div>
        
        <div class="footer">
            <p>© 2026 Медицинский калькулятор</p>
            <p><a href="/admin.html">Панель администратора</a></p>
        </div>
    </div>

    <script src="/widget-calculator.js"></script>
    <script>
        // Инициализация виджета
        const calculator = new MedicalCalculator('medical-calculator', {
            apiUrl: window.location.origin,
            apiKey: 'test-api-key-12345'
        });
    </script>
</body>
</html>
